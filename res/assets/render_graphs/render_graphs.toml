# Render graph definitions. Each names its recipe, a `script` resource whose module exports `build(context, parameters)`,
# and the recipe's static `parameters`; applications acquire instances of a definition with their runtime bindings
# (IRenderer::acquire_render_graph()).
include = []

[[resources]]
id = "draw_triangle_graph"
type = "render_graph"
recipe = "render_graphs.draw_triangle"

[[resources]]
id = "draw_cube_graph"
type = "render_graph"
recipe = "render_graphs.draw_cube"

[[resources]]
id = "draw_cube_unshaded_graph"
type = "render_graph"
recipe = "render_graphs.draw_cube_unshaded"

[[resources]]
id = "draw_material_variants_graph"
type = "render_graph"
recipe = "render_graphs.draw_material_variants"

[[resources]]
id = "draw_sponza_graph"
type = "render_graph"
recipe = "render_graphs.draw_sponza"

[[resources]]
id = "draw_skinned_mesh_graph"
type = "render_graph"
recipe = "render_graphs.draw_skinned_mesh"

[[resources]]
id = "pixel_sorting_graph"
type = "render_graph"
recipe = "render_graphs.pixel_sorting"

# The deferred test's two graphs differ only in how they filter shadows.
[[resources]]
id = "deferred_mipmap_graph"
type = "render_graph"
recipe = "render_graphs.deferred"

[resources.parameters]
summed_area_table = false
bloom_blur_pass_count = 4

[[resources]]
id = "deferred_summed_area_table_graph"
type = "render_graph"
recipe = "render_graphs.deferred"

[resources.parameters]
summed_area_table = true
bloom_blur_pass_count = 4
